<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MongongoWay</title>
  <meta name="description" content="La voix des musiciens de Theway RDC : écoutez gratuitement, soutenez les artistes.">
  <meta name="theme-color" content="#141022">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=32">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mw-theme')==='jour'?'jour':'nuit'}catch(e){document.documentElement.dataset.theme='nuit'}</script>
</head>
<body>
  <!-- Ouverture animée -->
  <div id="ouverture" class="ouverture" aria-hidden="true">
    <script>try{if(sessionStorage.getItem('mw-ouvert'))document.getElementById('ouverture').classList.add('deja')}catch(e){}</script>
    <div class="ouv-marque">
      <span class="ouv-lettres"><span style="--i:0">M</span><span style="--i:1">o</span><span style="--i:2">n</span><span style="--i:3">g</span><span style="--i:4">o</span><span style="--i:5">n</span><span style="--i:6">g</span></span><svg class="o-onde ouv-o" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="29"/><g><line x1="15" y1="25" x2="15" y2="33"/><line x1="23" y1="18" x2="23" y2="40"/><line x1="31" y1="13" x2="31" y2="45"/><line x1="39" y1="20" x2="39" y2="38"/><line x1="46" y1="26" x2="46" y2="32"/></g></svg><span class="way ouv-way">Way</span>
    </div>
    <div class="ouv-devise">La voix des musiciens de Theway RDC</div>
  </div>
  <header class="entete">
    <a href="#/accueil" class="logo">
      <span class="marque" role="img" aria-label="MongongoWay"><span>Mongong</span><svg class="o-onde" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="29"/><g><line x1="15" y1="25" x2="15" y2="33"/><line x1="23" y1="18" x2="23" y2="40"/><line x1="31" y1="13" x2="31" y2="45"/><line x1="39" y1="20" x2="39" y2="38"/><line x1="46" y1="26" x2="46" y2="32"/></g></svg><span class="way">Way</span></span>
    </a>
    <div class="entete-actions">
      <button id="btn-theme" class="rond" type="button" title="Passer en mode jour">☀</button>
      <a id="btn-notifs" class="rond cache" href="#/notifications" title="Notifications" aria-label="Notifications">🔔<span id="badge-notifs" class="pastille cache">0</span></a>
      <a id="btn-messages" class="rond" href="#/messages" title="Messages">✉<span id="badge-msg" class="pastille cache">0</span></a>
    </div>
  </header>

  <div id="onglets-musique" class="onglets onglets-section cache">
    <a href="#/musique" data-o="musique">Musique</a>
    <a href="#/artiste" data-o="artiste">Artiste</a>
  </div>
  <main id="vue" class="vue" aria-live="polite"></main>

  <!-- Lecteur audio -->
  <div id="lecteur" class="lecteur cache">
    <img id="lecteur-pochette" class="lecteur-pochette" alt="">
    <div class="lecteur-infos">
      <div id="lecteur-titre" class="lecteur-titre"></div>
      <div class="lecteur-artiste"><span id="lecteur-artiste"></span> · <span id="lecteur-mode" class="lecteur-mode">Aléatoire</span></div>
      <input id="lecteur-barre" class="lecteur-barre" type="range" min="0" max="100" value="0" step="0.1" aria-label="Position">
    </div>
    <button id="lecteur-bouton" class="lecteur-bouton" aria-label="Lecture / pause">▶</button>
    <audio id="audio" preload="none"></audio>
  </div>

  <nav id="nav" class="nav cache">
    <div class="nav-titre">Menu</div>
    <a href="#/accueil" data-route="accueil"><span class="ico">⌂<span id="pastille-fil" class="pastille pastille-nav cache"></span></span>Accueil</a>
    <a href="#/musique" data-route="musique"><span class="ico">♪</span>Musique</a>
    <a href="#/soutien" data-route="soutien"><span class="ico">♥</span>Soutien</a>
    <a href="#/profil" data-route="profil"><span class="ico">◉<span id="pastille-admin" class="pastille pastille-nav cache"></span></span>Profil</a>
  </nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="modale" class="modale cache"><div class="modale-boite" id="modale-boite"></div></div>

  <script type="module" src="app.js?v=32"></script>
</body>
</html>
